<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melodex Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 950px;
            margin: auto;
        }

        .card {
            background: #1e293b;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            border: 1px solid #334155;
        }

        h2 {
            color: #ffffff;
            margin-bottom: 18px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 500;
            color: #cbd5e1;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #ffffff;
            font-size: 14px;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #ef4444;
            outline: none;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.12);
        }

        textarea {
            resize: vertical;
        }

        button {
            background: #e11d48;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            background: #be123c;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .w-full {
            width: 100%;
        }

        .hidden {
            display: none !important;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding: 18px 20px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
        }

        .header-bar h2 {
            margin: 0;
        }

        .logout-btn {
            background: #ef4444;
            width: auto;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        .product-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            background: #0f172a;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            border: 1px solid #334155;
        }

        .product-img-group {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
            flex-wrap: wrap;
            max-width: 220px;
        }

        .product-item img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            aspect-ratio: 1 / 1;
            border-radius: 7px;
            border: 1px solid #475569;
        }

        .product-details {
            flex-grow: 1;
            min-width: 0;
        }

        .product-details h4 {
            margin-bottom: 4px;
            word-break: break-word;
        }

        .product-meta {
            font-size: 13px;
            color: #94a3b8;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .edit-btn {
            background: #f59e0b;
            color: #111827;
            padding: 8px 13px;
            font-size: 13px;
        }

        .edit-btn:hover {
            background: #d97706;
        }

        .delete-btn {
            background: #dc2626;
            padding: 8px 13px;
            font-size: 13px;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .cancel-btn {
            background: #475569;
            margin-top: 10px;
        }

        .cancel-btn:hover {
            background: #334155;
        }

        .hint {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 7px;
            display: block;
        }

        .image-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .preview-box {
            width: 100px;
            height: 100px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #334155;
            background: #0f172a;
        }

        .preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            aspect-ratio: 1 / 1;
        }

        .status-text {
            margin-top: 10px;
            font-size: 13px;
            color: #94a3b8;
        }

        @media (max-width: 700px) {
            body { padding: 12px; }
            .card { padding: 18px; }
            .header-bar { flex-direction: column; align-items: flex-start; }
            .logout-btn { width: 100%; }
            .product-item { flex-direction: column; align-items: flex-start; }
            .product-img-group { max-width: 100%; }
            .actions { width: 100%; }
            .edit-btn, .delete-btn { flex: 1; }
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBTVoMKlJeRWsgIL5gCdWCHYdx3w8brWHQ",
            authDomain: "melodex-store.firebaseapp.com",
            projectId: "melodex-store",
            storageBucket: "melodex-store.firebasestorage.app",
            messagingSenderId: "563447283369",
            appId: "1:563447283369:web:a999e89adf7380ec4733b8",
            measurementId: "G-G133358KKB"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let editDocId = null;
        let cachedProducts = {};

        const loginSection = document.getElementById("login-section");
        const adminPanel = document.getElementById("admin-panel");
        const loginBtn = document.getElementById("login-btn");
        const logoutBtn = document.getElementById("logout-btn");
        const saveProductBtn = document.getElementById("save-product-btn");
        const cancelEditBtn = document.getElementById("cancel-edit-btn");
        const productList = document.getElementById("product-list");
        const formTitle = document.getElementById("form-title");
        const imageInput = document.getElementById("prod-imgs");
        const imagePreview = document.getElementById("image-preview");

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.classList.add("hidden");
                adminPanel.classList.remove("hidden");
                loadProducts();
            } else {
                loginSection.classList.remove("hidden");
                adminPanel.classList.add("hidden");
            }
        });

        loginBtn.addEventListener("click", async () => {
            const email = document.getElementById("login-email").value.trim();
            const password = document.getElementById("login-pass").value;

            if (!email || !password) {
                alert("Email এবং Password দিন!");
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerText = "Logging in...";

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                alert("লগইন ব্যর্থ হয়েছে: " + error.message);
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerText = "Login";
            }
        });

        logoutBtn.addEventListener("click", async () => {
            await signOut(auth);
        });

        /* =========================================
           IMAGE PROCESSING: HD QUALITY 1:1 SQUARE
        ========================================= */
        function processImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);

                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;

                    img.onload = () => {
                        const finalSize = 800;
                        const canvas = document.createElement("canvas");
                        canvas.width = finalSize;
                        canvas.height = finalSize;

                        const ctx = canvas.getContext("2d");
                        
                        // ছবি যাতে ব্লার বা ঘোলা না হয় তার জন্য High Smoothing
                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = "high";

                        const originalWidth = img.width;
                        const originalHeight = img.height;
                        const sourceSize = Math.min(originalWidth, originalHeight);
                        const sourceX = Math.round((originalWidth - sourceSize) / 2);
                        const sourceY = Math.round((originalHeight - sourceSize) / 2);

                        ctx.fillStyle = "#ffffff";
                        ctx.fillRect(0, 0, finalSize, finalSize);

                        ctx.drawImage(
                            img,
                            sourceX,
                            sourceY,
                            sourceSize,
                            sourceSize,
                            0,
                            0,
                            finalSize,
                            finalSize
                        );

                        // ঝকঝকে কোয়ালিটি রাখার জন্য 0.88 ব্যবহার করা হয়েছে
                        const compressedImage = canvas.toDataURL("image/jpeg", 0.88);
                        resolve(compressedImage);
                    };

                    img.onerror = (error) => reject(error);
                };

                reader.onerror = (error) => reject(error);
            });
        }

        imageInput.addEventListener("change", async () => {
            imagePreview.innerHTML = "";
            const files = Array.from(imageInput.files);

            if (files.length > 4) {
                alert("সর্বোচ্চ ৪টি ছবি নির্বাচন করতে পারবেন!");
                imageInput.value = "";
                return;
            }

            for (const file of files) {
                const previewUrl = URL.createObjectURL(file);
                const previewBox = document.createElement("div");
                previewBox.className = "preview-box";
                previewBox.innerHTML = `<img src="${previewUrl}" alt="Preview">`;
                imagePreview.appendChild(previewBox);
            }
        });

        saveProductBtn.addEventListener("click", async () => {
            const name = document.getElementById("prod-name").value.trim();
            const price = document.getElementById("prod-price").value;
            const category = document.getElementById("prod-category").value;
            const description = document.getElementById("prod-desc").value.trim();
            const files = imageInput.files;

            if (!name || !price) {
                alert("দয়া করে Product Name এবং Price দিন!");
                return;
            }

            if (Number(price) < 0) {
                alert("সঠিক Price দিন!");
                return;
            }

            if (!editDocId && files.length === 0) {
                alert("নতুন প্রোডাক্টের জন্য অন্তত ১টি ছবি দিন!");
                return;
            }

            if (files.length > 4) {
                alert("সর্বোচ্চ ৪টি ছবি দিতে পারবেন!");
                return;
            }

            saveProductBtn.disabled = true;

            try {
                let imageUrls = [];

                if (files.length > 0) {
                    for (let i = 0; i < files.length; i++) {
                        saveProductBtn.innerText = `ছবি 1:1 করা হচ্ছে (${i + 1}/${files.length})...`;
                        const processedImage = await processImage(files[i]);
                        imageUrls.push(processedImage);
                    }
                }

                saveProductBtn.innerText = "Saving Product...";

                if (editDocId) {
                    const updateData = {
                        name: name,
                        price: Number(price),
                        category: category,
                        description: description,
                        updatedAt: serverTimestamp()
                    };

                    if (imageUrls.length > 0) {
                        updateData.image = imageUrls[0];
                        updateData.images = imageUrls;
                    }

                    await updateDoc(doc(db, "products", editDocId), updateData);
                    alert("প্রোডাক্ট সফলভাবে আপডেট হয়েছে!");
                    resetForm();
                } else {
                    await addDoc(collection(db, "products"), {
                        name: name,
                        price: Number(price),
                        category: category,
                        description: description,
                        image: imageUrls[0],
                        images: imageUrls,
                        createdAt: serverTimestamp(),
                        updatedAt: serverTimestamp()
                    });
                    alert("প্রোডাক্ট সফলভাবে যোগ হয়েছে!");
                    resetForm();
                }

                await loadProducts();
            } catch (error) {
                console.error(error);
                alert("সমস্যা হয়েছে: " + error.message);
            } finally {
                saveProductBtn.disabled = false;
                saveProductBtn.innerText = editDocId ? "Update Product" : "Add Product";
            }
        });

        function resetForm() {
            editDocId = null;
            document.getElementById("prod-name").value = "";
            document.getElementById("prod-price").value = "";
            document.getElementById("prod-category").value = "Guitars";
            document.getElementById("prod-desc").value = "";
            imageInput.value = "";
            imagePreview.innerHTML = "";
            formTitle.innerText = "Add New Product";
            saveProductBtn.innerText = "Add Product";
            cancelEditBtn.classList.add("hidden");
        }

        cancelEditBtn.addEventListener("click", resetForm);

        async function loadProducts() {
            productList.innerHTML = `<p style="color:#94a3b8;">Products loading...</p>`;

            try {
                const snapshot = await getDocs(collection(db, "products"));
                productList.innerHTML = "";
                cachedProducts = {};

                if (snapshot.empty) {
                    productList.innerHTML = `<p style="color:#94a3b8;">এখনো কোনো প্রোডাক্ট যোগ করা হয়নি।</p>`;
                    return;
                }

                snapshot.forEach((item) => {
                    const product = item.data();
                    cachedProducts[item.id] = product;

                    const images = Array.isArray(product.images) && product.images.length > 0
                        ? product.images
                        : (product.image ? [product.image] : []);

                    const div = document.createElement("div");
                    div.className = "product-item";

                    const imageGroup = document.createElement("div");
                    imageGroup.className = "product-img-group";

                    images.slice(0, 4).forEach((imageUrl) => {
                        const image = document.createElement("img");
                        image.src = imageUrl;
                        image.alt = product.name;
                        image.loading = "lazy";
                        imageGroup.appendChild(image);
                    });

                    const details = document.createElement("div");
                    details.className = "product-details";

                    const title = document.createElement("h4");
                    title.textContent = product.name || "Unnamed Product";

                    const meta = document.createElement("p");
                    meta.className = "product-meta";
                    meta.textContent = `৳${Number(product.price || 0).toLocaleString("en-BD")} | ${product.category || "No Category"} | ${images.length}টি ছবি`;

                    details.appendChild(title);
                    details.appendChild(meta);

                    const actions = document.createElement("div");
                    actions.className = "actions";

                    const editButton = document.createElement("button");
                    editButton.className = "edit-btn";
                    editButton.textContent = "Edit";
                    editButton.addEventListener("click", () => startEdit(item.id));

                    const deleteButton = document.createElement("button");
                    deleteButton.className = "delete-btn";
                    deleteButton.textContent = "Delete";
                    deleteButton.addEventListener("click", () => deleteProduct(item.id));

                    actions.appendChild(editButton);
                    actions.appendChild(deleteButton);

                    div.appendChild(imageGroup);
                    div.appendChild(details);
                    div.appendChild(actions);

                    productList.appendChild(div);
                });
            } catch (error) {
                console.error(error);
                productList.innerHTML = `<p style="color:#ef4444;">প্রোডাক্ট লোড করতে সমস্যা হয়েছে।</p>`;
            }
        }

        function startEdit(id) {
            const product = cachedProducts[id];
            if (!product) return;

            editDocId = id;
            document.getElementById("prod-name").value = product.name || "";
            document.getElementById("prod-price").value = product.price || "";
            document.getElementById("prod-category").value = product.category || "Guitars";
            document.getElementById("prod-desc").value = product.description || "";
            imageInput.value = "";
            imagePreview.innerHTML = "";
            formTitle.innerText = "Edit Product: " + (product.name || "");
            saveProductBtn.innerText = "Update Product";
            cancelEditBtn.classList.remove("hidden");
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        async function deleteProduct(id) {
            const confirmed = confirm("আপনি কি নিশ্চিত যে এই প্রোডাক্টটি Delete করতে চান?");
            if (!confirmed) return;

            try {
                await deleteDoc(doc(db, "products", id));
                await loadProducts();
                alert("প্রোডাক্ট Delete হয়েছে!");
            } catch (error) {
                alert("Delete করতে সমস্যা হয়েছে: " + error.message);
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <!-- LOGIN SECTION -->
        <div id="login-section" class="card">
            <h2>Melodex Admin Login</h2>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="login-email" placeholder="admin@example.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password">
            </div>
            <button id="login-btn" class="w-full">Login</button>
        </div>

        <!-- ADMIN PANEL -->
        <div id="admin-panel" class="hidden">
            <div class="header-bar">
                <h2>Melodex Admin Dashboard</h2>
                <button id="logout-btn" class="logout-btn">Logout</button>
            </div>

            <!-- ADD / EDIT PRODUCT -->
            <div class="card">
                <h2 id="form-title">Add New Product</h2>
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="prod-name" placeholder="যেমন: Boss DS-1 Distortion">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="prod-category">
                        <option value="Guitars">Guitars</option>
                        <option value="Pedals">Pedals</option>
                        <option value="Pedalboards">Pedalboards</option>
                        <option value="Stands">Stands</option>
                        <option value="Cables & Accessories">Cables & Accessories</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Price (BDT)</label>
                    <input type="number" id="prod-price" placeholder="যেমন: 8500" min="0">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="prod-desc" rows="3" placeholder="প্রোডাক্টের বিস্তারিত বিবরণ..."></textarea>
                </div>
                <div class="form-group">
                    <label>Product Images (১ থেকে ৪টি)</label>
                    <input type="file" id="prod-imgs" accept="image/*" multiple>
                    <span class="hint">সব ছবি Automatically 800 × 800px এবং 1:1 Square হবে।</span>
                    <span class="hint">Edit করার সময় নতুন ছবি না দিলে আগের ছবিগুলোই থাকবে।</span>
                    <div id="image-preview" class="image-preview"></div>
                </div>
                <button id="save-product-btn" class="w-full">Add Product</button>
                <button id="cancel-edit-btn" class="w-full cancel-btn hidden">Cancel Edit</button>
            </div>

            <!-- PRODUCT LIST -->
            <div class="card">
                <h2>Uploaded Products</h2>
                <div id="product-list"></div>
            </div>
        </div>
    </div>
</body>
</html>
