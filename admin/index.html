<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Melodex Admin Dashboard</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <style>
        * {
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 950px;
            margin: auto;
        }

        .card {
            background: #1e293b;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            border: 1px solid #334155;
        }

        h2 {
            color: #ffffff;
            margin-bottom: 18px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 500;
            color: #cbd5e1;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #ffffff;
            font-size: 14px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #ef4444;
            outline: none;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.12);
        }

        textarea {
            resize: vertical;
        }

        button {
            background: #e11d48;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            background: #be123c;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .w-full {
            width: 100%;
        }

        .hidden {
            display: none !important;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding: 18px 20px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
        }

        .header-bar h2 {
            margin: 0;
        }

        .logout-btn {
            background: #ef4444;
            width: auto;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        .product-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            background: #0f172a;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            border: 1px solid #334155;
        }

        .product-img-group {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
            flex-wrap: wrap;
            max-width: 220px;
        }

        .product-item img {

            height: 50px;
            object-fit: cover;
            aspect-ratio: 1 / 1;
            border-radius: 7px;
            border: 1px solid #475569;

        .product-details {
            flex-grow: 1;
            min-width: 0;
        }

        .product-details h4 {
            margin-bottom: 4px;
            word-break: break-word;
        }

        .product-meta {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .product-link {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            font-size: 11px;
            color: #64748b;
            word-break: break-all;
            line-height: 1.5;
        }

        .product-link i {
            color: #ef4444;
            margin-top: 3px;
            flex-shrink: 0;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            flex-shrink: 0;
        }

        .edit-btn {
            background: #f59e0b;
            color: #111827;
            padding: 8px 13px;
            font-size: 13px;
        }

        .edit-btn:hover {
            background: #d97706;
        }

        .delete-btn {
            background: #dc2626;
            padding: 8px 13px;
            font-size: 13px;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .copy-btn {
            background: #2563eb;
            padding: 8px 13px;
            font-size: 13px;
        }

        .copy-btn:hover {
            background: #1d4ed8;
        }

        .cancel-btn {
            background: #475569;
            margin-top: 10px;
        }

        .cancel-btn:hover {
            background: #334155;
        }

        .hint {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 7px;
            display: block;
        }

        .image-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .preview-box {
            width: 100px;
            height: 100px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #334155;
            background: #0f172a;
        }

        .preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            aspect-ratio: 1 / 1;
        }

        @media (max-width: 700px) {

            body {
                padding: 12px;
            }

            .card {
                padding: 18px;
            }

            .header-bar {
                flex-direction: column;
                align-items: flex-start;
            }

            .logout-btn {
                width: 100%;
            }

            .product-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .product-img-group {
                max-width: 100%;
            }

            .product-details {
                width: 100%;
            }

            .actions {
                width: 100%;
            }

            .edit-btn,
            .delete-btn,
            .copy-btn {
                flex: 1;
            }
        }
    </style>


    <script type="module">

        // =========================================================
        // OLD / WRONG ADMIN PRODUCT LINK REDIRECT
        // =========================================================
        // যদি কেউ পুরোনো:
        // /admin/?product=PRODUCT_ID
        // অথবা
        // /admin/index.html?product=PRODUCT_ID
        // খুলে, তাকে Public Product Page-এ পাঠাবে।
        // =========================================================

        (function redirectOldProductLink() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            const productId =
                params.get("product");

            if (!productId) {
                return;
            }

            const publicURL =
                new URL(
                    "../",
                    window.location.href
                );

            publicURL.search = "";
            publicURL.hash = "";

            publicURL.searchParams.set(
                "product",
                productId
            );

            window.location.replace(
                publicURL.href
            );

        })();


        // =========================================================
        // FIREBASE IMPORTS
        // =========================================================

        import {

        } from

            signInWithEmailAndPassword,
            onAuthStateChanged,

        } from

        import {

            collection,
            addDoc,
            getDocs,
            deleteDoc,
            doc,
            updateDoc,
            serverTimestamp
        } from
        "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";


        // =========================================================
        // FIREBASE CONFIG
        // =========================================================

        const firebaseConfig = {

            apiKey:
                "AIzaSyBTVoMKlJeRWsgIL5gCdWCHYdx3w8brWHQ",

            authDomain:
                "melodex-store.firebaseapp.com",

            projectId:
                "melodex-store",

            storageBucket:
                "melodex-store.firebasestorage.app",

            messagingSenderId:
                "563447283369",

            appId:
                "1:563447283369:web:a999e89adf7380ec4733b8",

            measurementId:
                "G-G133358KKB"

        };


        // =========================================================
        // FIREBASE INITIALIZATION
        // =========================================================

        const app =
            initializeApp(

            );

        const auth =
            getAuth(app);

        const db =

        // =========================================================
        // VARIABLES
        // =========================================================

        let editDocId = null;

        let cachedProducts = {};


        // =========================================================
        // DOM ELEMENTS
        // =========================================================

        const loginSection =
            document.getElementById(
                "login-section"
            );


        const adminPanel =
            document.getElementById(
                "admin-panel"
            );


        const loginBtn =
            document.getElementById(
                "login-btn"
            );


        const logoutBtn =
            document.getElementById(
                "logout-btn"
            );


        const saveProductBtn =
            document.getElementById(
                "save-product-btn"
            );


        const cancelEditBtn =
            document.getElementById(
                "cancel-edit-btn"
            );


        const productList =
            document.getElementById(
                "product-list"
            );


        const formTitle =
            document.getElementById(
                "form-title"
            );


        const imageInput =
            document.getElementById(
                "prod-imgs"
            );


        const imagePreview =
            document.getElementById(
                "image-preview"
            );


        // =========================================================
        // PUBLIC WEBSITE URL
        // =========================================================
        // Admin URL:
        // https://melodexbd.github.io/ecommerce-store/admin/
        //
        // Public URL:
        // https://melodexbd.github.io/ecommerce-store/
        // =========================================================

        function getPublicWebsiteURL() {

            const publicURL =
                new URL(
                    "../",
                    window.location.href
                );

            publicURL.search = "";
            publicURL.hash = "";

            return publicURL.href;

        }


        // =========================================================
        // PUBLIC PRODUCT URL
        // =========================================================

        function getPublicProductURL(productId) {

            const productURL =
                new URL(
                    "../",
                    window.location.href
                );

            productURL.search = "";
            productURL.hash = "";

            productURL.searchParams.set(
                "product",
                productId
            );

            return productURL.href;

        }


        // =========================================================
        // COPY TEXT FALLBACK
        // =========================================================

        async function copyText(text) {

            if (
                navigator.clipboard &&
                window.isSecureContext
            ) {

                await navigator.clipboard.writeText(
                    text
                );

                return true;

            }


            const textarea =
                document.createElement(
                    "textarea"
                );

            textarea.value = text;

            textarea.style.position =
                "fixed";

            textarea.style.left =
                "-9999px";

            textarea.style.top =
                "0";

            textarea.style.opacity =
                "0";

            document.body.appendChild(
                textarea
            );

            textarea.focus();

            textarea.select();

            textarea.setSelectionRange(
                0,
                textarea.value.length
            );


            const copied =
                document.execCommand(
                    "copy"
                );


            document.body.removeChild(
                textarea
            );


            return copied;

        }


        // =========================================================
        // AUTH STATE
        // =========================================================

        onAuthStateChanged(
            auth,
            (user) => {

                if (user) {

                    loginSection.classList.add(
                        "hidden"
                    );

                    adminPanel.classList.remove(
                        "hidden"
                    );

                    loadProducts();

                }

                else {

                    loginSection.classList.remove(
                        "hidden"
                    );

                    adminPanel.classList.add(
                        "hidden"
                    );

                }

            }
        );


        // =========================================================
        // LOGIN
        // =========================================================

        loginBtn.addEventListener(
            "click",
            async () => {

                const email =
                    document
                        .getElementById(
                            "login-email"
                        )
                        .value
                        .trim();


                const password =
                    document
                        .getElementById(
                            "login-pass"
                        )
                        .value;


                if (
                    !email ||
                    !password
                ) {

                    alert(
                        "Email এবং Password দিন!"
                    );

                    return;

                }


                loginBtn.disabled =
                    true;

                loginBtn.innerText =
                    "Logging in...";


                try {

                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );

                }

                catch (error) {

                    console.error(
                        error
                    );

                    alert(
                        "লগইন ব্যর্থ হয়েছে:\n\n" +
                        error.message
                    );

                }

                finally {

                    loginBtn.disabled =
                        false;

                    loginBtn.innerText =
                        "Login";

                }

            }
        );


        // =========================================================
        // ENTER KEY LOGIN
        // =========================================================

        document
            .getElementById("login-pass")
            .addEventListener(
                "keydown",
                (event) => {

                    if (
                        event.key === "Enter"
                    ) {

                        loginBtn.click();

                    }

                }
            );


        // =========================================================
        // LOGOUT
        // =========================================================

        logoutBtn.addEventListener(
            "click",
            async () => {

                try {

                    await signOut(auth);

                }

                catch (error) {

                    console.error(
                        error
                    );

                    alert(
                        "Logout করতে সমস্যা হয়েছে।"
                    );

                }

            }
        );


        // =========================================================
        // IMAGE PROCESSING
        // 800 x 800 HD SQUARE
        // =========================================================

        function processImage(file) {

            return new Promise(
                (resolve, reject) => {

                    const reader =
                        new FileReader();


                    reader.onload =
                        (event) => {

                            const img =
                                new Image();


                            img.onload =
                                () => {

                                    const finalSize =
                                        800;


                                    const canvas =
                                        document.createElement(
                                            "canvas"
                                        );


                                    canvas.width =
                                        finalSize;

                                    canvas.height =
                                        finalSize;


                                    const ctx =
                                        canvas.getContext(
                                            "2d"
                                        );


                                    ctx.imageSmoothingEnabled =
                                        true;

                                    ctx.imageSmoothingQuality =
                                        "high";


                                    const originalWidth =
                                        img.width;


                                    const originalHeight =
                                        img.height;


                                    const sourceSize =
                                        Math.min(
                                            originalWidth,
                                            originalHeight
                                        );


                                    const sourceX =
                                        Math.round(
                                            (
                                                originalWidth -
                                                sourceSize
                                            ) / 2
                                        );


                                    const sourceY =
                                        Math.round(
                                            (
                                                originalHeight -
                                                sourceSize
                                            ) / 2
                                        );


                                    ctx.fillStyle =
                                        "#ffffff";


                                    ctx.fillRect(
                                        0,
                                        0,
                                        finalSize,
                                        finalSize
                                    );


                                    ctx.drawImage(

                                        img,

                                        sourceX,
                                        sourceY,

                                        sourceSize,
                                        sourceSize,

                                        0,
                                        0,

                                        finalSize,
                                        finalSize

                                    );


                                    const compressedImage =
                                        canvas.toDataURL(
                                            "image/jpeg",
                                            0.88
                                        );


                                    resolve(
                                        compressedImage
                                    );

                                };


                            img.onerror =
                                (error) => {

                                    reject(
                                        error
                                    );

                                };


                            img.src =
                                event.target.result;

                        };


                    reader.onerror =
                        (error) => {

                            reject(
                                error
                            );

                        };


                    reader.readAsDataURL(
                        file
                    );

                }
            );

        }


        // =========================================================
        // IMAGE PREVIEW
        // =========================================================

        imageInput.addEventListener(
            "change",
            async () => {

                imagePreview.innerHTML =
                    "";


                const files =
                    Array.from(
                        imageInput.files
                    );


                if (
                    files.length > 4
                ) {

                    alert(
                        "সর্বোচ্চ ৪টি ছবি নির্বাচন করতে পারবেন!"
                    );

                    imageInput.value =
                        "";

                    return;

                }


                files.forEach(
                    (file) => {

                        const previewUrl =
                            URL.createObjectURL(
                                file
                            );


                        const previewBox =
                            document.createElement(
                                "div"
                            );


                        previewBox.className =
                            "preview-box";


                        const img =
                            document.createElement(
                                "img"
                            );


                        img.src =
                            previewUrl;

                        img.alt =
                            "Preview";

                        img.loading =
                            "lazy";


                        previewBox.appendChild(
                            img
                        );


                        imagePreview.appendChild(
                            previewBox
                        );

                    }
                );

            }
        );


        // =========================================================
        // SAVE PRODUCT
        // =========================================================

        saveProductBtn.addEventListener(
            "click",
            async () => {

                const name =
                    document
                        .getElementById(
                            "prod-name"
                        )
                        .value
                        .trim();


                const price =
                    document
                        .getElementById(
                            "prod-price"
                        )
                        .value;


                const category =
                    document
                        .getElementById(
                            "prod-category"
                        )
                        .value;


                const description =
                    document
                        .getElementById(
                            "prod-desc"
                        )
                        .value
                        .trim();


                const files =
                    Array.from(
                        imageInput.files
                    );


                // -------------------------------------------------
                // VALIDATION
                // -------------------------------------------------

                if (
                    !name ||
                    price === ""
                ) {

                    alert(
                        "দয়া করে Product Name এবং Price দিন!"
                    );

                    return;

                }


                if (
                    Number(price) < 0 ||
                    !Number.isFinite(
                        Number(price)
                    )
                ) {

                    alert(
                        "সঠিক Price দিন!"
                    );

                    return;

                }


                if (
                    !editDocId &&
                    files.length === 0
                ) {

                    alert(
                        "নতুন প্রোডাক্টের জন্য অন্তত ১টি ছবি দিন!"
                    );

                    return;

                }


                if (
                    files.length > 4
                ) {

                    alert(
                        "সর্বোচ্চ ৪টি ছবি দিতে পারবেন!"
                    );

                    return;

                }


                saveProductBtn.disabled =
                    true;


                const isEditing =
                    Boolean(
                        editDocId
                    );


                try {

                    let imageUrls =
                        [];


                    // -------------------------------------------------
                    // PROCESS IMAGES
                    // -------------------------------------------------

                    if (
                        files.length > 0
                    ) {

                        for (
                            let i = 0;
                            i < files.length;
                            i++
                        ) {

                            saveProductBtn.innerText =
                                `ছবি Processing হচ্ছে (${i + 1}/${files.length})...`;


                            const processedImage =
                                await processImage(
                                    files[i]
                                );


                            imageUrls.push(
                                processedImage
                            );

                        }

                    }


                    saveProductBtn.innerText =
                        isEditing
                            ? "Updating Product..."
                            : "Saving Product...";


                    // =================================================
                    // UPDATE EXISTING PRODUCT
                    // =================================================

                    if (
                        editDocId
                    ) {

                        const updateData = {

                            name:
                                name,

                            price:
                                Number(
                                    price
                                ),

                            category:
                                category,

                            description:
                                description,

                            updatedAt:
                                serverTimestamp()

                        };


                        // নতুন ছবি দিলে নতুন ছবিগুলো replace হবে
                        // ছবি না দিলে আগের ছবিগুলো থাকবে

                        if (
                            imageUrls.length > 0
                        ) {

                            updateData.image =
                                imageUrls[0];

                            updateData.images =
                                imageUrls;

                        }


                        await updateDoc(

                            doc(
                                db,
                                "products",
                                editDocId
                            ),

                            updateData

                        );


                        alert(
                            "প্রোডাক্ট সফলভাবে আপডেট হয়েছে!"
                        );


                        resetForm();

                    }


                    // =================================================
                    // ADD NEW PRODUCT
                    // =================================================

                    else {

                        const newProduct =
                            await addDoc(

                                collection(
                                    db,
                                    "products"
                                ),

                                {

                                    name:
                                        name,

                                    price:
                                        Number(
                                            price
                                        ),

                                    category:
                                        category,

                                    description:
                                        description,

                                    image:
                                        imageUrls[0],

                                    images:
                                        imageUrls,

                                    createdAt:
                                        serverTimestamp(),

                                    updatedAt:
                                        serverTimestamp()

                                }

                            );


                        // =================================================
                        // CORRECT PUBLIC PRODUCT LINK
                        // =================================================

                        const productURL =
                            getPublicProductURL(
                                newProduct.id
                            );


                        alert(
                            "প্রোডাক্ট সফলভাবে যোগ হয়েছে!\n\n" +
                            "Public Product Link:\n\n" +
                            productURL
                        );


                        resetForm();

                    }


                    await loadProducts();

                }

                catch (error) {

                    console.error(
                        "Save Product Error:",
                        error
                    );


                    alert(
                        "সমস্যা হয়েছে:\n\n" +
                        error.message
                    );

                }

                finally {

                    saveProductBtn.disabled =
                        false;


                    saveProductBtn.innerText =
                        editDocId
                            ? "Update Product"
                            : "Add Product";

                }

            }
        );


        // =========================================================
        // RESET FORM
        // =========================================================

        function resetForm() {

            editDocId =

            document
                .getElementById(
                    "prod-name"
                )

                "";


            document
                .getElementById(
                    "prod-price"
                )
                .value =
                "";


            document
                .getElementById(
                    "prod-category"
                )
                .value =
                "Guitars";


            document
                .getElementById(
                    "prod-desc"
                )
                .value =
                "";


            imageInput.value =
                "";


            imagePreview.innerHTML =
                "";


            formTitle.innerText =
                "Add New Product";


            saveProductBtn.innerText =
                "Add Product";


            cancelEditBtn
                .classList
                .add(
                    "hidden"
                );

        }


        // =========================================================
        // CANCEL EDIT
        // =========================================================

        cancelEditBtn.addEventListener(
            "click",
            resetForm
        );


        // =========================================================
        // LOAD PRODUCTS
        // =========================================================

        async function loadProducts() {

            productList.innerHTML =
                `
                <p style="color:#94a3b8;">
                    Products loading...
                </p>
                `;


            try {

                const snapshot =
                    await getDocs(
                        collection(
                            db,
                            "products"
                        )
                    );


                productList.innerHTML =
                    "";


                cachedProducts =
                    {};


                if (
                    snapshot.empty
                ) {

                    productList.innerHTML =
                        `
                        <p style="color:#94a3b8;">
                            এখনো কোনো প্রোডাক্ট যোগ করা হয়নি।
                        </p>
                        `;

                    return;

                }


                snapshot.forEach(
                    (item) => {

                        const product =
                            item.data();


                        cachedProducts[
                            item.id
                        ] =
                            product;


                        // =================================================
                        // IMAGES
                        // =================================================

                        const images =
                            Array.isArray(
                                product.images
                            ) &&
                            product.images.length > 0

                                ? product.images

                                : (
                                    product.image
                                        ? [
                                            product.image
                                        ]
                                        : []
                                );


                        // =================================================
                        // PRODUCT ITEM
                        // =================================================

                        const div =
                            document.createElement(
                                "div"
                            );


                        div.className =
                            "product-item";


                        // =================================================
                        // IMAGE GROUP
                        // =================================================

                        const imageGroup =
                            document.createElement(
                                "div"
                            );


                        imageGroup.className =
                            "product-img-group";


                        images
                            .slice(
                                0,
                                4
                            )
                            .forEach(
                                (
                                    imageUrl
                                ) => {

                                    const image =
                                        document.createElement(
                                            "img"
                                        );


                                    image.src =
                                        imageUrl;


                                    image.alt =
                                        product.name ||
                                        "Product";


                                    image.loading =
                                        "lazy";


                                    image.onerror =
                                        () => {

                                            image.style.display =
                                                "none";

                                        };


                                    imageGroup.appendChild(
                                        image
                                    );

                                }
                            );


                        // =================================================
                        // DETAILS
                        // =================================================

                        const details =
                            document.createElement(
                                "div"
                            );


                        details.className =
                            "product-details";


                        const title =
                            document.createElement(
                                "h4"
                            );


                        title.textContent =
                            product.name ||
                            "Unnamed Product";


                        const meta =
                            document.createElement(
                                "p"
                            );


                        meta.className =
                            "product-meta";


                        meta.textContent =
                            `৳${Number(
                                product.price || 0
                            ).toLocaleString(
                                "en-BD"
                            )} | ${
                                product.category ||
                                "No Category"
                            } | ${
                                images.length
                            }টি ছবি`;


                        // =================================================
                        // CORRECT PUBLIC PRODUCT URL
                        // =================================================

                        const productURL =
                            getPublicProductURL(
                                item.id
                            );


                        const linkText =
                            document.createElement(
                                "div"
                            );


                        linkText.className =
                            "product-link";


                        const linkIcon =
                            document.createElement(
                                "i"
                            );


                        linkIcon.className =
                            "fas fa-link";


                        const linkValue =
                            document.createElement(
                                "span"
                            );


                        linkValue.textContent =
                            productURL;


                        linkText.appendChild(
                            linkIcon
                        );

                        linkText.appendChild(
                            linkValue
                        );


                        details.appendChild(
                            title
                        );


                        details.appendChild(
                            meta
                        );


                        details.appendChild(
                            linkText
                        );


                        // =================================================
                        // ACTIONS
                        // =================================================

                        const actions =
                            document.createElement(
                                "div"
                            );


                        actions.className =
                            "actions";


                        // =================================================
                        // COPY LINK BUTTON
                        // =================================================

                        const copyButton =
                            document.createElement(
                                "button"
                            );


                        copyButton.className =
                            "copy-btn";


                        copyButton.innerText =
                            "Copy Link";


                        copyButton.addEventListener(
                            "click",
                            async () => {

                                const oldText =
                                    copyButton.innerText;


                                copyButton.disabled =
                                    true;


                                try {

                                    const copied =
                                        await copyText(
                                            productURL
                                        );


                                    if (
                                        copied
                                    ) {

                                        copyButton.innerText =
                                            "Copied ✓";


                                        setTimeout(
                                            () => {

                                                copyButton.innerText =
                                                    oldText;

                                                copyButton.disabled =
                                                    false;

                                            },
                                            1500
                                        );

                                    }

                                    else {

                                        copyButton.disabled =
                                            false;

                                        prompt(
                                            "এই Public Product Link Copy করুন:",
                                            productURL
                                        );

                                    }

                                }

                                catch (error) {

                                    console.error(
                                        error
                                    );


                                    copyButton.disabled =
                                        false;


                                    prompt(
                                        "এই Public Product Link Copy করুন:",
                                        productURL
                                    );

                                }

                            }
                        );


                        // =================================================
                        // EDIT BUTTON
                        // =================================================

                        const editButton =
                            document.createElement(
                                "button"
                            );


                        editButton.className =
                            "edit-btn";


                        editButton.textContent =
                            "Edit";


                        editButton.addEventListener(
                            "click",
                            () => {

                                startEdit(
                                    item.id
                                );

                            }
                        );


                        // =================================================
                        // DELETE BUTTON
                        // =================================================

                        const deleteButton =
                            document.createElement(
                                "button"
                            );


                        deleteButton.className =
                            "delete-btn";


                        deleteButton.textContent =
                            "Delete";


                        deleteButton.addEventListener(
                            "click",
                            () => {

                                deleteProduct(
                                    item.id
                                );

                            }
                        );


                        // =================================================
                        // APPEND ACTIONS
                        // =================================================

                        actions.appendChild(
                            copyButton
                        );


                        actions.appendChild(
                            editButton
                        );


                        actions.appendChild(
                            deleteButton
                        );


                        // =================================================
                        // APPEND PRODUCT ITEM
                        // =================================================

                        div.appendChild(
                            imageGroup
                        );


                        div.appendChild(
                            details
                        );


                        div.appendChild(
                            actions
                        );


                        productList.appendChild(
                            div
                        );

                    }
                );

            }

            catch (error) {

                console.error(
                    "Load Products Error:",
                    error
                );


                productList.innerHTML =
                    `
                    <p style="color:#ef4444;">
                        প্রোডাক্ট লোড করতে সমস্যা হয়েছে।
                        <br><br>
                        ${error.message}
                    </p>
                    `;

            }

        }


        // =========================================================
        // START EDIT
        // =========================================================

        function startEdit(id) {

            const product =
                cachedProducts[
                    id
                ];


            if (!product) {

                alert(
                    "Product পাওয়া যায়নি।"
                );

                return;

            }


            editDocId =
                id;


            document
                .getElementById(
                    "prod-name"
                )
                .value =
                product.name ||
                "";


            document
                .getElementById(
                    "prod-price"
                )
                .value =
                product.price ||
                "";


            document
                .getElementById(
                    "prod-category"
                )
                .value =
                product.category ||
                "Guitars";


            document
                .getElementById(
                    "prod-desc"
                )
                .value =
                product.description ||
                "";


            // নতুন ছবি না দিলে আগের ছবি থাকবে

            imageInput.value =
                "";


            imagePreview.innerHTML =
                "";


            // =================================================
            // SHOW CURRENT IMAGES
            // =================================================

            const existingImages =
                Array.isArray(
                    product.images
                ) &&
                product.images.length > 0

                    ? product.images

                    : (
                        product.image
                            ? [
                                product.image
                            ]
                            : []
                    );


            existingImages
                .slice(
                    0,
                    4
                )
                .forEach(
                    (imageUrl) => {

                        const previewBox =
                            document.createElement(
                                "div"
                            );


                        previewBox.className =
                            "preview-box";


                        const img =
                            document.createElement(
                                "img"
                            );


                        img.src =
                            imageUrl;


                        img.alt =
                            "Existing Product Image";


                        previewBox.appendChild(
                            img
                        );


                        imagePreview.appendChild(
                            previewBox
                        );

                    }
                );


            formTitle.innerText =
                "Edit Product: " +
                (
                    product.name ||
                    ""
                );


            saveProductBtn.innerText =
                "Update Product";


            cancelEditBtn
                .classList
                .remove(
                    "hidden"
                );


            window.scrollTo({

                top: 0,

                behavior: "smooth"

            });

        }


        // =========================================================
        // DELETE PRODUCT
        // =========================================================

        async function deleteProduct(id) {

            const product =
                cachedProducts[
                    id
                ];


            const productName =
                product &&
                product.name
                    ? product.name
                    : "এই প্রোডাক্ট";


            const confirmed =
                confirm(
                    `"${productName}"\n\nএই প্রোডাক্টটি Delete করতে চান?`
                );


            if (
                !confirmed
            ) {

                return;

            }


            try {

                await deleteDoc(

                    doc(
                        db,
                        "products",
                        id
                    )

                );


                await loadProducts();


                alert(
                    "প্রোডাক্ট Delete হয়েছে!"
                );

            }

            catch (error) {

                console.error(
                    "Delete Product Error:",
                    error
                );


                alert(
                    "Delete করতে সমস্যা হয়েছে:\n\n" +
                    error.message
                );

            }

        }


        // =========================================================
        // GLOBAL ERROR HANDLING
        // =========================================================

        window.addEventListener(
            "unhandledrejection",
            (event) => {

                console.error(
                    "Unhandled Promise Error:",
                    event.reason
                );

            }
        );

    </script>

</head>


<body>

<div class="container">


    <!-- =======================================================
         LOGIN SECTION
         ======================================================= -->

    <div
        id="login-section"
        class="card"
    >

        <h2>
            Melodex Admin Login
        </h2>


        <div class="form-group">

            <label>
                Email
            </label>

            <input
                type="email"
                id="login-email"
                placeholder="admin@example.com"
                autocomplete="email"
            >

        </div>


        <div class="form-group">

            <label>
                Password
            </label>

            <input
                type="password"
                id="login-pass"
                placeholder="••••••••"
                autocomplete="current-password"
            >

        </div>


        <button
            id="login-btn"
            class="w-full"
        >
            Login
        </button>

    </div>



    <!-- =======================================================
         ADMIN PANEL
         ======================================================= -->

    <div
        id="admin-panel"
        class="hidden"
    >


        <!-- HEADER -->

        <div class="header-bar">

            <h2>
                Melodex Admin Dashboard
            </h2>


            <button
                id="logout-btn"
                class="logout-btn"
            >
                Logout
            </button>

        </div>



        <!-- ===================================================
             ADD / EDIT PRODUCT
             =================================================== -->

        <div class="card">

            <h2 id="form-title">
                Add New Product
            </h2>


            <!-- PRODUCT NAME -->

            <div class="form-group">

                <label>
                    Product Name
                </label>


                <input
                    type="text"
                    id="prod-name"
                    placeholder="যেমন: Boss DS-1 Distortion"
                    autocomplete="off"
                >

            </div>



            <!-- CATEGORY -->

            <div class="form-group">

                <label>
                    Category
                </label>


                <select
                    id="prod-category"
                >

                    <option value="Guitars">
                        Guitars
                    </option>

                    <option value="Pedals">
                        Pedals
                    </option>

                    <option value="Pedalboards">
                        Pedalboards
                    </option>

                    <option value="Stands">
                        Stands
                    </option>

                    <option value="Cables & Accessories">
                        Cables & Accessories
                    </option>

                </select>

            </div>



            <!-- PRICE -->

            <div class="form-group">

                <label>
                    Price (BDT)
                </label>


                <input
                    type="number"
                    id="prod-price"
                    placeholder="যেমন: 8500"
                    min="0"
                    step="1"
                >

            </div>



            <!-- DESCRIPTION -->

            <div class="form-group">

                <label>
                    Description
                </label>


                <textarea
                    id="prod-desc"
                    rows="3"
                    placeholder="প্রোডাক্টের বিস্তারিত বিবরণ..."
                ></textarea>

            </div>



            <!-- PRODUCT IMAGES -->

            <div class="form-group">

                <label>
                    Product Images (১ থেকে ৪টি)
                </label>


                <input
                    type="file"
                    id="prod-imgs"
                    accept="image/*"
                    multiple
                >


                <span class="hint">

                    সব ছবি Automatically
                    800 × 800px এবং
                    1:1 Square হবে।

                </span>


                <span class="hint">

                    Edit করার সময় নতুন ছবি
                    না দিলে আগের ছবিগুলোই থাকবে।

                </span>


                <div
                    id="image-preview"
                    class="image-preview"
                ></div>

            </div>



            <!-- SAVE -->

            <button
                id="save-product-btn"
                class="w-full"
            >
                Add Product
            </button>



            <!-- CANCEL EDIT -->

            <button
                id="cancel-edit-btn"
                class="w-full cancel-btn hidden"
            >
                Cancel Edit
            </button>

        </div>



        <!-- ===================================================
             PRODUCT LIST
             =================================================== -->

        <div class="card">

            <h2>
                Uploaded Products
            </h2>


            <div
                id="product-list"
            ></div>

        </div>


    </div>

</div>

</body>
</html>
